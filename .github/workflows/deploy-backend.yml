name: Deploy Backend API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC login (federated credential on github-uploaderapp-deployer, main branch)
  contents: read

env:
  AZURE_WEBAPP_NAME: doc-uploader-dev-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy API

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish backend/DocUploaderApi.csproj --configuration Release --output ${{ github.workspace }}/api-publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/api-publish

      - name: Health check
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health
