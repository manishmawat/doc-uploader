name: Deploy Infrastructure and App with azd

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'azure.yaml'
      - 'infra/**'
      - '.github/workflows/deploy-azd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AZURE_ENV_NAME: uploaderapp
  AZURE_LOCATION: eastus

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy with Azure Developer CLI

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install azd CLI
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash
          echo "$HOME/.azd/bin" >> $GITHUB_PATH

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: federated

      - name: azd provision
        run: azd provision --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}

      - name: azd deploy
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}

      - name: Display deployment outputs
        run: |
          azd env get-values
