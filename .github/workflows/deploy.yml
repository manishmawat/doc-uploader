name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      contents: read
      pull-requests: write # "Comment PR with deployment URL" (repo default token is read-only)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore frontend/UploaderDoc.csproj

      - name: Build
        run: dotnet build frontend/UploaderDoc.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish frontend/UploaderDoc.csproj --configuration Release --no-build --output ${{ github.workspace }}/publish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ng-app/package-lock.json

      - name: Build Angular app (My Documents)
        working-directory: ng-app
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Add Angular app to the site under /ng/
        run: |
          mkdir -p ${{ github.workspace }}/publish/wwwroot/ng
          cp -r ng-app/dist/ng-app/browser/. ${{ github.workspace }}/publish/wwwroot/ng/

      - name: Deploy to Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/wwwroot"
          output_location: ""
          skip_api_build: true
          skip_app_build: true

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Static Web App deployed to: ${{ steps.deploy.outputs.static_web_app_url }}`
            })
