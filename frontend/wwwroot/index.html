<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UploaderDoc</title>
    <base href="/" />
    <!-- <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" /> -->
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="UploaderDoc.styles.css" rel="stylesheet" />
    <!-- <link href="manifest.webmanifest" rel="manifest" /> -->
    <!-- <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script>
        window.downloadFile = (filename, contentType, content) => {
            const blob = new Blob([new Uint8Array(content)], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        window.getImageInfo = (imageBytes) => {
            return new Promise((resolve, reject) => {
                try {
                    console.log('getImageInfo called with imageBytes length:', imageBytes.length);
                    const blob = new Blob([new Uint8Array(imageBytes)], { type: 'image/*' });
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    
                    img.onload = () => {
                        console.log('Image loaded successfully:', img.naturalWidth, 'x', img.naturalHeight);
                        URL.revokeObjectURL(url);
                        resolve({
                            width: img.naturalWidth,
                            height: img.naturalHeight
                        });
                    };
                    
                    img.onerror = (error) => {
                        console.error('Image load error:', error);
                        URL.revokeObjectURL(url);
                        reject(new Error('Failed to load image'));
                    };
                    
                    img.src = url;
                } catch (error) {
                    console.error('getImageInfo error:', error);
                    reject(error);
                }
            });
        };

        window.getImageInfoFromBase64 = (base64Data) => {
            return new Promise((resolve, reject) => {
                try {
                    console.log('getImageInfoFromBase64 called with base64 length:', base64Data.length);
                    const img = new Image();
                    
                    img.onload = () => {
                        console.log('Base64 image loaded successfully:', img.naturalWidth, 'x', img.naturalHeight);
                        resolve({
                            width: img.naturalWidth,
                            height: img.naturalHeight
                        });
                    };
                    
                    img.onerror = (error) => {
                        console.error('Base64 image load error:', error);
                        reject(new Error('Failed to load base64 image'));
                    };
                    
                    img.src = 'data:image/*;base64,' + base64Data;
                } catch (error) {
                    console.error('getImageInfoFromBase64 error:', error);
                    reject(error);
                }
            });
        };
    </script>
    <!-- <script>navigator.serviceWorker.register('service-worker.js');</script> -->
</body>

</html>
